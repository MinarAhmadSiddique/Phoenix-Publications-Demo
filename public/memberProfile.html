<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Member &middot; Phoenix Publications</title>
<link rel="stylesheet" href="css/tokens.css">
<style>
  .wrap { max-width: var(--maxw); margin: 0 auto; padding: 0 var(--space-6); }

  header.top { border-bottom: 1px solid var(--line); position: sticky; top: 0; z-index: 50; background: rgba(251,249,244,0.85); backdrop-filter: blur(8px); }
  .top-inner { max-width: var(--maxw); margin: 0 auto; padding: var(--space-4) var(--space-6); display: flex; align-items: center; justify-content: space-between; gap: var(--space-6); }
  .brand { font-family: var(--font-display); font-weight: 600; font-size: var(--size-lg); color: var(--ink); display: flex; align-items: baseline; gap: var(--space-2); }
  .brand .mark { color: var(--ember); }
  nav.main { display: flex; gap: var(--space-6); align-items: center; font-size: var(--size-sm); }
  nav.main a { color: var(--ink); opacity: 0.8; }
  nav.main a:hover { opacity: 1; text-decoration: none; }
  .btn { font-family: var(--font-body); font-size: var(--size-sm); font-weight: 500; padding: var(--space-2) var(--space-4); border-radius: var(--radius); border: 1px solid var(--ink); background: transparent; color: var(--ink); cursor: pointer; transition: background .15s, color .15s; }
  .btn:hover { background: var(--ink); color: var(--paper); text-decoration: none; }
  .btn.solid { background: var(--ink); color: var(--paper); }
  .btn.solid:hover { background: var(--ember); border-color: var(--ember); }

  .profile-head { padding: var(--space-16) 0 var(--space-12); border-bottom: 1px solid var(--line); }
  .ph-row { display: grid; grid-template-columns: auto 1fr auto; gap: var(--space-8); align-items: start; }

  .avatar {
    width: 104px; height: 104px; border-radius: 50%;
    background: linear-gradient(150deg, var(--pine), var(--ink));
    display: flex; align-items: center; justify-content: center;
    font-family: var(--font-display); font-size: var(--size-2xl); color: var(--paper);
    box-shadow: var(--shadow); flex-shrink: 0; overflow: hidden;
  }

  .ph-main .name { font-family: var(--font-display); font-size: var(--size-3xl); font-weight: 600; letter-spacing: -0.02em; margin-bottom: var(--space-1); }
  .ph-main .handle { font-size: var(--size-sm); color: var(--stone); margin-bottom: var(--space-4); }
  .ph-main .tagline { font-family: var(--font-display); font-style: italic; font-size: var(--size-lg); color: var(--ink); opacity: 0.85; max-width: 52ch; margin-bottom: var(--space-6); }

  .stats { display: flex; gap: var(--space-8); }
  .stat .num { font-family: var(--font-display); font-size: var(--size-xl); font-weight: 600; }
  .stat .lab { font-size: var(--size-xs); letter-spacing: 0.08em; text-transform: uppercase; color: var(--stone); }

  /* Achievements */
  .achievements { display: flex; flex-wrap: wrap; gap: var(--space-3); margin-top: var(--space-6); }
  .ach {
    display: inline-flex; align-items: center; gap: var(--space-2);
    padding: var(--space-2) var(--space-4); border-radius: 100px;
    border: 1px solid var(--line); background: var(--paper);
    font-size: var(--size-sm); font-weight: 500; color: var(--ink); cursor: default;
  }
  .ach .ic { font-size: var(--size-base); line-height: 1; }
  .ach.featured { border-color: var(--ember); color: var(--ember); background: rgba(181,70,46,0.06); }

  .ph-actions { display: flex; flex-direction: column; gap: var(--space-3); align-items: flex-end; position: relative; }
  .ph-actions .report { font-size: var(--size-xs); color: var(--stone); }

  #sharePanel { display:none; position:absolute; top:100%; right:0; margin-top:var(--space-2); background:var(--paper); border:1px solid var(--line); border-radius:var(--radius); padding:var(--space-4); box-shadow:var(--shadow); z-index:60; width:300px; }
  #sharePanel .st { font-size:var(--size-sm); font-weight:500; margin-bottom:var(--space-2); text-align:left; }
  #sharePanel .srow { display:flex; gap:var(--space-2); margin-bottom:var(--space-3); }
  #sharePanel input { flex:1; font-size:var(--size-xs); padding:var(--space-2); border:1px solid var(--line); border-radius:var(--radius); background:var(--paper); color:var(--ink); min-width:0; }
  #sharePanel .socials { display:flex; gap:var(--space-2); }
  #sharePanel .socials a { flex:1; text-align:center; padding:var(--space-2); font-size:var(--size-xs); }

  .bio { padding: var(--space-12) 0; border-bottom: 1px solid var(--line); }
  .bio .label { font-size: var(--size-xs); letter-spacing: 0.12em; text-transform: uppercase; color: var(--stone); font-weight: 600; margin-bottom: var(--space-4); }
  .bio p { font-size: var(--size-lg); line-height: 1.6; max-width: 68ch; margin: 0; color: var(--ink); opacity: 0.9; }

  .shelf { padding: var(--space-16) 0; }
  .shelf .sec-head { display: flex; align-items: baseline; justify-content: space-between; margin-bottom: var(--space-8); }
  .shelf h2 { font-size: var(--size-2xl); letter-spacing: -0.01em; }
  .shelf .count { font-size: var(--size-sm); color: var(--stone); }

  .grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: var(--space-8); }
  .work { display: flex; flex-direction: column; }
  .work .cover {
    width: 100%; aspect-ratio: 3/3.8; border-radius: var(--radius); box-shadow: var(--shadow);
    background: linear-gradient(150deg, var(--pine), var(--ink));
    display: flex; align-items: center; justify-content: center; margin-bottom: var(--space-4);
    overflow: hidden; transition: transform .15s; position: relative;
  }
  .work:hover .cover { transform: translateY(-3px); }
  .work .cover .ph { font-family: var(--font-display); color: rgba(251,249,244,0.85); font-size: var(--size-base); text-align: center; padding: var(--space-4); line-height: 1.3; }
  .work .cover img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .work .wtype { font-size: var(--size-xs); letter-spacing: 0.1em; text-transform: uppercase; color: var(--stone); font-weight: 600; margin-bottom: var(--space-2); }
  .work .wtitle { font-family: var(--font-display); font-size: var(--size-lg); font-weight: 600; line-height: 1.15; margin-bottom: var(--space-2); display: block; color: var(--ink); }
  .work a.wtitle:hover { color: var(--ember); text-decoration: none; }
  .work .wfoot { display: flex; align-items: center; gap: var(--space-4); margin-top: auto; padding-top: var(--space-3); }
  .work .price { font-weight: 600; font-size: var(--size-sm); }
  .work .price.free { color: var(--pine); }
  .work .likes { font-size: var(--size-xs); color: var(--stone); }
  .work .ribbon { position: absolute; top: var(--space-3); left: var(--space-3); background: var(--ember); color: var(--paper); font-size: var(--size-xs); font-weight: 600; padding: 2px var(--space-2); border-radius: var(--radius); letter-spacing: 0.04em; z-index: 2; }

  .empty { border: 1px dashed var(--line); border-radius: var(--radius); padding: var(--space-16); text-align: center; }
  .empty h3 { font-size: var(--size-xl); margin-bottom: var(--space-3); }
  .empty p { color: var(--stone); max-width: 44ch; margin: 0 auto var(--space-6); }

  .state { text-align: center; padding: var(--space-16) var(--space-6); max-width: 52ch; margin: 0 auto; }
  .state .ico { font-size: 56px; margin-bottom: var(--space-4); }
  .state h1 { font-family: var(--font-display); font-size: var(--size-2xl); margin-bottom: var(--space-4); }
  .state p { color: var(--stone); line-height: 1.6; margin-bottom: var(--space-8); }

  footer.foot { border-top: 1px solid var(--line); padding: var(--space-12) 0; margin-top: var(--space-8); }
  .foot-row { display: flex; justify-content: space-between; align-items: center; gap: var(--space-6); flex-wrap: wrap; font-size: var(--size-sm); color: var(--stone); }
  .foot-row .brand { font-size: var(--size-base); }
  .foot-row a { color: var(--stone); }

  @media (max-width: 820px) {
    .ph-row { grid-template-columns: auto 1fr; }
    .ph-actions { grid-column: 1 / -1; flex-direction: row; align-items: center; justify-content: flex-start; margin-top: var(--space-4); }
    .ph-main .name { font-size: var(--size-2xl); }
    .grid { grid-template-columns: repeat(2, 1fr); gap: var(--space-6); }
  }
  @media (max-width: 520px) {
    .grid { grid-template-columns: 1fr 1fr; }
    .stats { gap: var(--space-6); }
  }
</style>
</head>
<body>

<header class="top">
  <div class="top-inner">
    <a class="brand" href="index.html"><span class="mark">&#10022;</span> Phoenix Publications</a>
    <nav class="main">
      <a class="hide-sm" href="search.html">Browse</a>
      <a href="login.html">Log in</a>
      <a class="btn solid" href="signup.html">Join Phoenix</a>
    </nav>
  </div>
</header>

<!-- Normal profile (shown when public or owner) -->
<div id="profileView">
  <section class="profile-head">
    <div class="wrap">
      <div class="ph-row">
        <div class="avatar">&nbsp;</div>
        <div class="ph-main">
          <div class="name">&nbsp;</div>
          <div class="handle">&nbsp;</div>
          <div class="tagline"></div>
          <div class="stats">
            <div class="stat"><div class="num">0</div><div class="lab">Published</div></div>
            <div class="stat"><div class="num">0</div><div class="lab">Followers</div></div>
            <div class="stat"><div class="num">0</div><div class="lab">Following</div></div>
          </div>
          <div id="achievements" class="achievements"></div>
        </div>
        <div class="ph-actions">
          <button class="btn solid" type="button" id="followBtn">Follow</button>
          <button class="btn" type="button" id="shareBtn">Share profile</button>
          <a class="report" href="legal/report.html">Report this member</a>

          <div id="sharePanel">
            <div class="st">Share this profile</div>
            <div class="srow">
              <input id="shareUrl" type="text" readonly aria-label="Profile link">
              <button id="copyBtn" class="btn" type="button" style="padding:var(--space-2) var(--space-3); white-space:nowrap;">Copy</button>
            </div>
            <div class="socials">
              <a id="shareX" class="btn" href="#" target="_blank" rel="noopener">X</a>
              <a id="shareFb" class="btn" href="#" target="_blank" rel="noopener">Facebook</a>
              <a id="shareWa" class="btn" href="#" target="_blank" rel="noopener">WhatsApp</a>
            </div>
          </div>
        </div>
      </div>
    </div>
  </section>

  <section class="bio">
    <div class="wrap">
      <div class="label">About</div>
      <p class="biotext"></p>
    </div>
  </section>

  <section class="shelf">
    <div class="wrap">
      <div class="sec-head">
        <h2>Their shelf</h2>
        <span class="count"></span>
      </div>
      <div class="grid"></div>
    </div>
  </section>
</div>

<!-- Graceful state (private / not found) -->
<div id="stateView" style="display:none">
  <div class="wrap"><div class="state" id="stateCard"></div></div>
</div>

<footer class="foot">
  <div class="wrap">
    <div class="foot-row">
      <div class="brand"><span class="mark" style="color:var(--ember)">&#10022;</span> Phoenix Publications</div>
      <div>
        <a href="search.html">Browse</a> &nbsp;&middot;&nbsp;
        <a href="legal/terms.html">Terms</a> &nbsp;&middot;&nbsp;
        <a href="legal/privacy.html">Privacy</a> &nbsp;&middot;&nbsp;
        <a href="legal/report.html">Report something</a>
      </div>
      <div>&copy; 2026 Phoenix</div>
    </div>
  </div>
</footer>

<script>
document.addEventListener('DOMContentLoaded', async () => {
  // ---- Login-aware nav ----
  try {
    const meRes = await fetch('/api/me');
    if (meRes.ok) {
      const me = await meRes.json();
      const nav = document.querySelector('nav.main');
      const avatarInner = (me.avatar_key && me.avatar_key !== 'none')
        ? '<img src="/' + me.avatar_key + '" alt="You" style="width:100%;height:100%;object-fit:cover;display:block">'
        : (me.display_name || '?').split(' ').map(w => w[0]).join('').slice(0,2).toUpperCase();
      if (nav) {
        nav.innerHTML =
          '<a class="hide-sm" href="index.html">Home</a>' +
          '<a class="hide-sm" href="members/dashboard.html">Dashboard</a>' +
          '<a class="hide-sm" href="members/library.html">Library</a>' +
          '<a class="hide-sm" href="search.html">Browse</a>' +
          '<a class="btn solid" href="members/publish.html">Publish</a>' +
          '<a href="members/editProfile.html" title="Settings" style="display:inline-flex;align-items:center"><span style="width:32px;height:32px;border-radius:50%;overflow:hidden;display:inline-flex;align-items:center;justify-content:center;background:linear-gradient(150deg,var(--pine),var(--ink));color:var(--paper);font-family:var(--font-display);font-size:var(--size-xs);flex-shrink:0">' + avatarInner + '</span></a>' +
          '<a href="/logout">Log out</a>';
      }
    }
  } catch (e) {}

  function esc(s){ return (s||'').replace(/</g,'&lt;'); }
  function priceLabel(cents) { return cents === 0 ? 'Free' : '$' + (cents / 100).toFixed(2); }
  function initials(name) { return (name||'?').split(' ').map(w => w[0]).join('').slice(0,2).toUpperCase(); }

  function renderAchievements(list) {
    const box = document.getElementById('achievements');
    if (!box) return;
    if (!list || list.length === 0) { box.innerHTML = ''; return; }
    const icons = {
      featured: '\u2726', leaderboard: '\u2605', loved: '\u2665', discussed: '\uD83D\uDCAC',
      published1: '\u270D', published5: '\u270D', published10: '\u2726'
    };
    box.innerHTML = list.map(a =>
      '<span class="ach ' + (a.key === 'featured' ? 'featured' : '') + '" title="' + esc(a.desc || '') + '">' +
        '<span class="ic">' + (icons[a.key] || '\u2726') + '</span>' + esc(a.label) +
      '</span>'
    ).join('');
  }

  const params = new URLSearchParams(window.location.search);
  const handle = params.get('handle');

  function showState(icon, title, body) {
    document.getElementById('profileView').style.display = 'none';
    const sv = document.getElementById('stateView');
    sv.style.display = 'block';
    document.getElementById('stateCard').innerHTML =
      '<div class="ico">' + icon + '</div>' +
      '<h1>' + title + '</h1>' +
      '<p>' + body + '</p>' +
      '<a class="btn solid" href="search.html">Browse Phoenix</a>';
    document.title = title + ' \u00B7 Phoenix Publications';
  }

  if (!handle) {
    showState('&#128269;', 'No member specified', 'The link seems incomplete. Try browsing to find who you\'re looking for.');
    return;
  }

  try {
    const res = await fetch('/api/member/' + encodeURIComponent(handle));

    if (!res.ok) {
      let data = {};
      try { data = await res.json(); } catch (e) {}
      const isPrivate = data.error && data.error.toLowerCase().includes('private');
      if (isPrivate) {
        showState('&#128274;', 'This profile is private',
          'This member has chosen to keep their profile to themselves. Not everyone here is a writer &mdash; some people just come to read, quietly. That\'s welcome too.');
      } else {
        showState('&#128269;', 'We couldn\'t find that profile',
          'This member may have changed their handle, or the link might be incomplete. Try browsing to find who you\'re looking for.');
      }
      return;
    }

    const m = await res.json();
    document.title = m.display_name + ' \u00B7 Phoenix Publications';

    // Avatar
    const avatarEl = document.querySelector('.avatar');
    if (m.avatar_key && m.avatar_key !== 'none') {
      avatarEl.innerHTML = '<img src="/' + m.avatar_key + '" alt="' + esc(m.display_name) + '" style="width:100%;height:100%;object-fit:cover">';
    } else {
      avatarEl.textContent = initials(m.display_name);
    }

    // Name / handle / tagline
    document.querySelector('.name').textContent = m.display_name;
    const joinYear = new Date(m.created_at.replace(' ', 'T') + 'Z').getFullYear();
    document.querySelector('.handle').innerHTML = '@' + esc(m.handle) + ' &middot; Joined ' + joinYear;
    const tagEl = document.querySelector('.tagline');
    if (m.tagline) tagEl.textContent = '\u201C' + m.tagline + '\u201D';
    else tagEl.style.display = 'none';

    // Stats
    const stats = document.querySelectorAll('.stats .stat');
    const liveCount = m.books.filter(b => b.status === 'live').length;
    if (stats[0]) stats[0].querySelector('.num').textContent = liveCount;
    if (stats[1]) stats[1].querySelector('.num').textContent = m.followers;
    if (stats[2]) stats[2].style.display = 'none';

    // Achievements
    renderAchievements(m.achievements);

    // Bio
    const bioEl = document.querySelector('.biotext');
    if (bioEl) bioEl.textContent = m.bio || 'This member hasn\'t written a bio yet.';

    // Shelf count
    const countEl = document.querySelector('.count');
    if (countEl) countEl.textContent = liveCount + (liveCount === 1 ? ' work' : ' works');

    // Works grid
    const grid = document.querySelector('.grid');
    grid.innerHTML = '';
    const visible = m.books.filter(b => b.status === 'live' || b.status === 'featured' || m.isOwner);
    if (visible.length === 0) {
      grid.innerHTML = '<div class="empty"><h3>The shelf is waiting.</h3><p>Nothing here yet &mdash; but everyone starts with an empty shelf. The first piece is always the bravest.</p></div>';
    } else {
      for (const b of visible) {
        const art = document.createElement('article');
        art.className = 'work';
        const cover = (b.cover_key && b.cover_key !== 'none' && b.cover_key !== 'pending')
          ? '<img src="/' + b.cover_key + '" alt="' + esc(b.title) + '">'
          : '<span class="ph">' + esc(b.title) + '</span>';
        const ribbon = b.is_featured ? '<span class="ribbon">Featured</span>' : '';
        art.innerHTML =
          '<a href="bookDetail.html?id=' + b.id + '" class="cover">' + ribbon + cover + '</a>' +
          '<div class="wtype">' + esc(b.content_type || '') + '</div>' +
          '<a href="bookDetail.html?id=' + b.id + '" class="wtitle">' + esc(b.title) + '</a>' +
          '<div class="wfoot">' +
            '<span class="price' + (b.price_cents === 0 ? ' free' : '') + '">' + priceLabel(b.price_cents) + '</span>' +
            '<span class="likes">&#9829; ' + (b.likes != null ? b.likes : 0) + '</span>' +
          '</div>';
        grid.appendChild(art);
      }
    }

    // Follow / Edit button
    const followBtn = document.getElementById('followBtn');
    if (followBtn) {
      if (m.isOwner) {
        followBtn.textContent = 'Edit profile';
        followBtn.onclick = () => { window.location.href = 'members/editProfile.html'; };
      } else {
        const renderFollow = (f) => { followBtn.textContent = f ? 'Following' : 'Follow'; };
        renderFollow(m.iFollow);
        followBtn.addEventListener('click', async () => {
          const r = await fetch('/api/member/' + encodeURIComponent(handle) + '/follow', {
            method: 'POST', headers: { 'Content-Type': 'application/json' }, body: '{}'
          });
          if (r.status === 401) { window.location.href = '/login.html'; return; }
          if (r.ok) {
            const result = await r.json();
            renderFollow(result.following);
            if (stats[1]) stats[1].querySelector('.num').textContent = result.followers;
          }
        });
      }
    }

    // ---- Share ----
    const shareBtn = document.getElementById('shareBtn');
    const sharePanel = document.getElementById('sharePanel');
    const shareUrl = document.getElementById('shareUrl');
    const copyBtn = document.getElementById('copyBtn');
    const profileUrl = window.location.origin + '/memberProfile.html?handle=' + encodeURIComponent(m.handle);
    if (shareUrl) shareUrl.value = profileUrl;

    const shareText = encodeURIComponent('Read ' + m.display_name + ' on Phoenix Publications');
    const encodedUrl = encodeURIComponent(profileUrl);
    const sx = document.getElementById('shareX'), sf = document.getElementById('shareFb'), swa = document.getElementById('shareWa');
    if (sx) sx.href = 'https://twitter.com/intent/tweet?text=' + shareText + '&url=' + encodedUrl;
    if (sf) sf.href = 'https://www.facebook.com/sharer/sharer.php?u=' + encodedUrl;
    if (swa) swa.href = 'https://wa.me/?text=' + shareText + '%20' + encodedUrl;

    if (shareBtn && sharePanel) {
      shareBtn.addEventListener('click', (e) => {
        e.stopPropagation();
        sharePanel.style.display = (sharePanel.style.display === 'none' || !sharePanel.style.display) ? 'block' : 'none';
      });
      document.addEventListener('click', (e) => {
        if (!sharePanel.contains(e.target) && e.target !== shareBtn) sharePanel.style.display = 'none';
      });
    }
    if (copyBtn && shareUrl) {
      copyBtn.addEventListener('click', async () => {
        try { await navigator.clipboard.writeText(shareUrl.value); }
        catch (e) { shareUrl.select(); document.execCommand('copy'); }
        copyBtn.textContent = 'Copied \u2713';
        setTimeout(() => { copyBtn.textContent = 'Copy'; }, 1500);
      });
    }

  } catch (err) {
    console.error('Could not load profile:', err);
    showState('&#9888;', 'Something went wrong', 'We couldn\'t load this profile right now. Please try again in a moment.');
  }
});
</script>

</body>
</html>
