
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Set a new password &middot; Phoenix Publications</title>
<link rel="stylesheet" href="css/tokens.css">
<style>
  body { margin:0; min-height:100vh; background:var(--paper); color:var(--ink); font-family:var(--font-body); display:flex; align-items:center; justify-content:center; padding:40px 20px; }
  .card { max-width:400px; width:100%; }
  .brand { font-family:var(--font-display); font-weight:600; font-size:var(--size-lg); color:var(--ember); margin-bottom:var(--space-8); display:block; text-decoration:none; }
  h1 { font-size:var(--size-2xl); letter-spacing:-0.01em; margin-bottom:var(--space-2); }
  .lead { font-size:var(--size-sm); color:var(--stone); margin-bottom:var(--space-8); line-height:1.5; }
  label { display:block; font-size:var(--size-sm); font-weight:500; margin-bottom:var(--space-2); margin-top:var(--space-5); }
  input { width:100%; font-family:var(--font-body); font-size:var(--size-base); padding:var(--space-3) var(--space-4); border:1px solid var(--line); border-radius:var(--radius); background:var(--paper); color:var(--ink); box-sizing:border-box; }
  input:focus { outline:none; border-color:var(--ember); }
  button { width:100%; font-family:var(--font-body); font-size:var(--size-base); font-weight:500; padding:var(--space-3); border:1px solid var(--ink); border-radius:var(--radius); background:var(--ink); color:var(--paper); cursor:pointer; margin-top:var(--space-6); }
  button:hover { background:var(--ember); border-color:var(--ember); }
  button:disabled { opacity:0.6; cursor:default; }
  .msg { padding:var(--space-3) var(--space-4); border-radius:var(--radius); font-size:var(--size-sm); margin-bottom:var(--space-6); line-height:1.5; display:none; }
  .msg.err { background:#fdecea; color:#a3271b; display:block; }
  .msg.ok { background:rgba(61,90,82,0.12); color:var(--pine); display:block; }
  .back { margin-top:var(--space-8); font-size:var(--size-sm); text-align:center; }
</style>
</head>
<body>
  <div class="card">
    <a class="brand" href="index.html">&#10022; Phoenix Publications</a>
    <h1>Set a new password</h1>
    <div class="lead">Choose a new password for your account. At least 8 characters.</div>
 
    <div class="msg" id="msg"></div>
 
    <div id="formArea">
      <label for="password">New password</label>
      <input type="password" id="password" placeholder="At least 8 characters" autocomplete="new-password">
      <label for="confirm">Confirm new password</label>
      <input type="password" id="confirm" placeholder="Type it again" autocomplete="new-password">
      <button type="button" id="saveBtn">Set new password</button>
    </div>
 
    <div class="back"><a href="login.html">Back to log in</a></div>
  </div>
 
<script>
document.addEventListener('DOMContentLoaded', () => {
  const params = new URLSearchParams(window.location.search);
  const token = params.get('token');
  const msg = document.getElementById('msg');
  const formArea = document.getElementById('formArea');
  const pw = document.getElementById('password');
  const confirm = document.getElementById('confirm');
  const saveBtn = document.getElementById('saveBtn');
 
  function showErr(t){ msg.textContent = t; msg.className = 'msg err'; }
  function showOk(t){ msg.textContent = t; msg.className = 'msg ok'; }
 
  if (!token) {
    showErr('This reset link is missing its code. Please request a new one from the login page.');
    formArea.style.display = 'none';
    return;
  }
 
  saveBtn.addEventListener('click', async () => {
    const password = pw.value;
    if (password.length < 8) { showErr('Password must be at least 8 characters.'); return; }
    if (password !== confirm.value) { showErr('The passwords don\u2019t match.'); return; }
    saveBtn.textContent = 'Saving\u2026'; saveBtn.disabled = true;
    try {
      const r = await fetch('/api/reset-password', {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ token, password })
      });
      const data = await r.json();
      if (r.ok) {
        showOk('Your password has been reset. You can now log in with your new password.');
        formArea.style.display = 'none';
        setTimeout(() => window.location.href = 'login.html', 2000);
      } else {
        showErr(data.error || 'Could not reset your password.');
        saveBtn.textContent = 'Set new password'; saveBtn.disabled = false;
      }
    } catch (err) {
      showErr('Something went wrong. Please try again.');
      saveBtn.textContent = 'Set new password'; saveBtn.disabled = false;
    }
  });
});
</script>
</body>
</html>
